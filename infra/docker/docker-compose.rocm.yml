# AMD GPU (ROCm) for `vlm-server`, e.g. ONE GCD of an MI250:
#   VLM_GPU=0 make up PLATFORM=rocm
#   VLM_GPU=0 docker compose -f docker-compose.yml -f infra/docker/docker-compose.rocm.yml up -d --build
# Paths stay relative to the repo root: Compose resolves them against the project directory,
# which is the directory of the FIRST -f file (docker-compose.yml).
services:
  vlm-server:
    build:
      context: 3rdparty/vlm_server
      dockerfile: docker/Dockerfile.rocm
      args:
        BASE: ${ROCM_VLLM_IMAGE:-rocm/vllm:rocm7.14.1_cdna_ubuntu24.04_py3.14_pytorch_2.11_vllm_0.23.0}
    image: vlm-engine:rocm
    environment:
      VLM_SERVER_PLATFORM: rocm
      # All /dev/dri nodes are passed through; exactly this GCD is made visible to vLLM.
      VLM_SERVER_GPU: "${VLM_GPU:-0}"
    # deploy.resources asks for an "nvidia" driver; ROCm uses plain device nodes instead.
    deploy: !reset {}
    devices:
      - /dev/kfd
      - /dev/dri
    # group_add takes GIDs as the HOST numbers them; the names inside the ROCm image may map to
    # different GIDs. Check yours with: getent group video render
    group_add:
      - "${DRI_VIDEO_GID:-44}"
      - "${DRI_RENDER_GID:-109}"
    security_opt:
      - seccomp=unconfined
    shm_size: 16g
